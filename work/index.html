<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>autoRPG</title><link rel="stylesheet" href="css/base.css"><style>*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:6px}.app header h1{font-size:20px;margin:4px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:sticky;top:0;z-index:100;background:inherit;padding:4px 0}.tabs button{min-height:42px;font-size:12px}.tabs button.active{font-weight:bold}.tab-panel{display:none}.tab-panel.active{display:block}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:5px}.toolbar button{min-height:40px}.toolbar label{display:flex;align-items:center;gap:4px}.toolbar select,.toolbar input{width:100%;min-height:38px}button,select,input{pointer-events:auto!important;cursor:pointer;position:relative;z-index:20}.panel{margin:6px 0;padding:8px}.dungeon-info-line{display:flex!important;flex-flow:row nowrap!important;align-items:center!important;justify-content:flex-start!important;gap:7px;white-space:nowrap!important;overflow:hidden!important;width:100%;min-width:0;font-size:12px;line-height:1.5;padding:1px 0}.dungeon-info-line span,.dungeon-info-line i{display:block!important;flex:0 0 auto!important;white-space:nowrap!important}.dungeon-info-line b{font-weight:700}.dungeon-info-line .sep{opacity:.45}.battle-summary{padding:6px;border-bottom:1px solid #ddd}.battle-detail{max-height:220px;overflow:auto}.battle-event{font-size:.82em;padding:3px 0}.battle-event.defeat,.battle-event.critical{font-weight:bold}.dialogue{min-height:3em;margin-top:6px;padding:6px;border-top:1px solid #ddd;font-size:13px}.loot-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.loot-box,.stats-box{min-width:0}.loot-box h2,.stats-box h2{font-size:16px;margin:2px 0 6px}.loot{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}.stat-row{font-size:12px;padding:3px 0;border-bottom:1px solid #eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.log-box{height:180px;overflow:auto;border:1px solid #ddd;padding:6px;font-size:11px;line-height:1.4;white-space:pre-wrap;word-break:break-word;margin:0}.party-card{display:flex;width:100%;text-align:left;gap:9px;margin:6px 0;padding:8px;cursor:pointer}.party-card.down{opacity:.55}.portrait{width:42px;height:42px;display:grid;place-items:center;border:1px solid #aaa}.party-main{flex:1}.hpbar{height:6px;background:#ddd;margin:5px 0}.hpbar i{display:block;height:100%}.party-main span,.party-main small{display:block}.modal{position:fixed;inset:0;background:#0008;z-index:1000;align-items:center;justify-items:center}.modal[hidden]{display:none!important}.modal-card{background:#fff;color:#111;padding:20px;min-width:280px;max-width:90vw;position:relative}.close{position:absolute;right:8px;top:8px}.quest-tabs{display:flex;gap:6px}.quest-item{padding:8px 0;border-bottom:1px solid #ddd}.progress{font-size:.9em}@media(max-width:520px){.app{padding:4px}.panel{padding:6px}.toolbar button{font-size:11px}.dungeon-info-line{gap:5px;font-size:11px}.loot-stats{gap:4px}.log-box{height:170px}.tabs button{font-size:11px}}@media(min-width:521px){.log-box{height:210px}}</style></head><body><main class="app"><header><h1>autoRPG</h1><small id="status">준비</small></header><nav class="tabs"><button class="active" data-tab="dungeonTab">던전</button><button data-tab="innTab">여관</button><button data-tab="shopTab">상점</button><button data-tab="extraTab">기타</button></nav><section class="toolbar"><label>던전 <select id="dungeonSelect"></select></label><label>Seed <input id="seed" type="number" value="12345"></label><button id="startDungeon">던전 탐험 시작</button><button id="stepDungeon" disabled>다음 진행</button><button id="run100">100회 전투</button><button id="reset">초기화</button></section><section id="dungeonTab" class="tab-panel active"><article class="panel"><div id="dungeon"></div></article><article class="panel battle-panel"><h2>현재 전투</h2><div id="battle"></div><div id="dialogue" class="dialogue"><div>“전투를 시작할 준비가 됐어.”</div><div>“모두 조심해서 가자.”</div></div></article><section class="loot-stats"><article class="panel loot-box"><h2>획득 아이템</h2><div id="loot"></div></article><article class="panel stats-box"><h2>누적 통계</h2><div id="stats"></div></article></section><article class="panel"><h2>탐험 로그</h2><pre id="log" class="log-box"></pre></article></section><section id="innTab" class="tab-panel"><article class="panel"><h2>여관 · 파티</h2><p>캐릭터 선택 → 상세 능력치 / 장비</p><div id="party"></div></article><article class="panel"><h2>퀘스트</h2><div class="quest-tabs"><button id="mainQuestTab" class="active">메인</button><button id="repeatQuestTab">반복</button></div><div id="quests"></div></article></section><section id="shopTab" class="tab-panel"><article class="panel"><h2>상점</h2><p>장비와 소모품 판매 영역</p><div id="shop"></div></article></section><section id="extraTab" class="tab-panel"><article class="panel"><h2>기타</h2><p>도감 · 업적 · 설정 · 저장/불러오기 확장 영역</p></article></section></main><div id="characterDetail" class="modal" hidden></div><script src="src/core/SeededRandom.js"></script><script src="src/core/GameState.js"></script><script src="src/battle/Character.js"></script><script src="src/battle/DamageCalculator.js"></script><script src="src/battle/BattleEngine.js"></script><script src="src/battle/BattleViewModel.js"></script><script src="src/character/CharacterFactory.js"></script><script src="data/characters/dummy-party.js"></script><script src="data/dungeons/ancient-forest.js"></script><script src="data/dungeons/goblin-cave.js"></script><script src="data/dungeons/ancient-ruins.js"></script><script src="data/dungeon-registry.js"></script><script src="data/dialogues.js"></script><script src="data/quests/main-quests.js"></script><script src="data/quests/repeatable-quests.js"></script><script src="data/quests/quest-registry.js"></script><script src="src/quest/QuestEngine.js"></script><script src="src/battle/DialogueResolver.js"></script><script src="src/world/DungeonRun.js"></script><script src="src/ui/PartyPanel.js"></script><script src="src/app.js"></script><script>let questTab='main';document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});function renderQuests(){const engine=window.questEngine;if(!engine){$('quests').innerHTML='<p>퀘스트 엔진 준비 중</p>';return}const list=engine.getActive(questTab==='main'?'main':'repeatable');$('quests').innerHTML=list.length?list.map(q=>{const p=state.quests?.[q.id];return `<div class="quest-item"><b>${q.name||q.title||q.id}</b><div>${q.description||''}</div>${(q.objectives||[]).map((o,i)=>`<div class="progress">${o.description||o.type}: ${engine.progress(q,i)} / ${o.count}</div>`).join('')}</div>`}).join(''):'<p>진행 가능한 퀘스트가 없습니다.</p>'}function initQuestUI(){window.questEngine=new QuestEngine({state,quests:window.ALL_QUESTS,onEvent:e=>{state.lastQuestEvent=e;renderQuests()}});renderQuests()}initQuestUI();renderQuests();</script><script>function compactDungeonInfo(){if(!window.run||!$('dungeon'))return;const d=run.dungeon;const floor=Math.min(run.floor,d.floors);$('dungeon').innerHTML=`<div class="dungeon-info-line"><span><b>${d.name}</b></span><i class="sep">·</i><span>${floor}/${d.floors}층</span><i class="sep">·</i><span>${run.complete?'완료':run.active?'탐험 중':'종료'}</span><i class="sep">·</i><span>Seed ${state.seed}</span><i class="sep">·</i><span>G ${run.gold}</span><i class="sep">·</i><span>EXP ${run.exp}</span></div>`}if(window.render){const r=window.render;window.render=function(){r();compactDungeonInfo()}}else compactDungeonInfo();</script></body></html>
