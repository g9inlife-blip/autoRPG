<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>autoRPG Dungeon Workbench</title><link rel="stylesheet" href="css/base.css">
</head>
<body><main class="app">
<header><h1>autoRPG Dungeon Workbench</h1><p>던전 탐험 · 전투 · 누적 DPS · Loot 테스트</p><small id="status">준비</small></header>
<section class="toolbar">
<label>던전 <select id="dungeonSelect"></select></label>
<label>Seed <input id="seed" type="number" value="12345"></label>
<button id="startDungeon">던전 탐험 시작</button><button id="stepDungeon" disabled>다음 진행</button><button id="run100">100회 전투</button><button id="reset">초기화</button>
</section>
<section class="grid">
<article class="panel"><h2>던전</h2><div id="dungeon"></div></article>
<article class="panel"><h2>파티</h2><div id="party"></div></article>
<article class="panel battle-panel"><h2>현재 전투</h2><div id="battle"></div><div id="dialogue" class="dialogue"><div>“전투를 시작할 준비가 됐어.”</div><div>“모두 조심해서 가자.”</div></div></article>
<article class="panel"><h2>누적 통계</h2><div id="stats"></div></article>
<article class="panel"><h2>획득 아이템</h2><div id="loot"></div></article>
<article class="panel log-panel"><h2>탐험 로그</h2><pre id="log"></pre></article>
</section></main>
<script src="src/core/SeededRandom.js"></script><script src="src/core/GameState.js"></script><script src="src/battle/Character.js"></script><script src="src/battle/DamageCalculator.js"></script><script src="src/battle/BattleEngine.js"></script>
<script src="data/dungeons/ancient-forest.js"></script><script src="data/dungeons/goblin-cave.js"></script><script src="data/dungeons/ancient-ruins.js"></script><script src="data/dungeon-registry.js"></script><script src="data/dialogues.js"></script>
<script src="src/world/DungeonRun.js"></script><script src="src/app.js"></script>
</body></html>
