<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>autoRPG</title><link rel="stylesheet" href="css/base.css"><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;min-width:0}body{font-size:14px}.app{width:100%;max-width:480px;margin:0 auto;padding:4px}.app header{padding:4px 6px}.app header h1{font-size:18px;margin:0 0 2px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;position:sticky;top:0;z-index:100;background:inherit;padding:3px 0}.tabs button{min-height:40px;padding:4px 2px;font-size:12px}.tab-panel{display:none}.tab-panel.active{display:block}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:4px}.toolbar label{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px;min-width:0;font-size:11px}.toolbar select,.toolbar input,.toolbar button{width:100%;min-width:0;min-height:38px;font-size:12px}.toolbar button{grid-column:auto}.panel{width:100%;margin:5px 0;padding:7px;border-radius:4px;min-width:0}.dungeon-info-line{display:flex!important;flex-flow:row nowrap!important;align-items:center!important;gap:5px;width:100%;min-width:0;overflow:hidden!important;white-space:nowrap!important;font-size:11px;line-height:1.5}.dungeon-info-line span,.dungeon-info-line i{display:block!important;flex:0 0 auto!important;white-space:nowrap!important}.dungeon-info-line b{font-weight:700}.dungeon-info-line .sep{opacity:.45}.battle-panel h2,.panel h2{font-size:15px;margin:2px 0 6px}.battle-detail{max-height:190px;overflow:auto}.battle-event{font-size:11px;padding:3px 0}.dialogue{min-height:42px;margin-top:5px;padding:5px;border-top:1px solid #ddd;font-size:12px;line-height:1.35}.loot-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px}.loot-box,.stats-box{min-width:0}.loot-box h2,.stats-box h2{font-size:14px}.loot,.stat-row{font-size:11px;padding:3px 0}.stat-row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #eee}.log-box{height:165px;overflow:auto;margin:0;border:1px solid #ddd;padding:4px;font-size:11px;line-height:1.35}.exploration-log-row{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:transparent;border:0;border-bottom:1px solid #ddd;padding:7px 2px;font-size:11px;min-height:34px}.exploration-log-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.exploration-log-row b{flex:0 0 auto;margin-left:5px}.detail-body{max-height:60vh;overflow:auto;font-size:11px;line-height:1.45}.detail-line{padding:3px 0;border-bottom:1px solid #eee}.party-card{display:flex;width:100%;text-align:left;gap:7px;margin:5px 0;padding:7px}.portrait{width:38px;height:38px;flex:0 0 38px}.party-main{min-width:0;flex:1}.hpbar{height:6px;margin:4px 0}.modal{position:fixed;inset:0;background:#0008;z-index:1000;align-items:center;justify-items:center;padding:10px}.modal[hidden]{display:none!important}.modal:not([hidden]){display:grid}.modal-card{width:min(100%,430px);max-height:85vh;overflow:auto;background:#fff;color:#111;padding:16px;position:relative;border-radius:6px}.close{position:absolute;right:6px;top:6px;min-width:36px;min-height:36px}.quest-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px}.quest-item{padding:7px 0;border-bottom:1px solid #ddd}.progress{font-size:11px}@media(min-width:481px){body{background:#eee}.app{background:inherit}}@media(max-width:360px){.app{padding:3px}.toolbar{gap:3px}.toolbar select,.toolbar input,.toolbar button{font-size:11px}.dungeon-info-line{font-size:10px;gap:4px}.panel{padding:5px}.log-box{height:150px}}button,select,input{pointer-events:auto!important;cursor:pointer;position:relative;z-index:20}</style></head><body><main class="app"><header><h1>autoRPG</h1><small id="status">준비</small></header><nav class="tabs"><button class="active" data-tab="dungeonTab">던전</button><button data-tab="innTab">여관</button><button data-tab="shopTab">상점</button><button data-tab="extraTab">기타</button></nav><section class="toolbar"><label>던전<select id="dungeonSelect"></select></label><label>Seed<input id="seed" type="number" value="12345"></label><button id="startDungeon">탐험 시작</button><button id="stepDungeon" disabled>다음 진행</button><button id="run100">100회 전투</button><button id="reset">초기화</button></section><section id="dungeonTab" class="tab-panel active"><article class="panel"><div id="dungeon"></div></article><article class="panel battle-panel"><h2>현재 전투</h2><div id="battle"></div><div id="dialogue" class="dialogue"><div>“전투를 시작할 준비가 됐어.”</div><div>“모두 조심해서 가자.”</div></div></article><section class="loot-stats"><article class="panel loot-box"><h2>획득 아이템</h2><div id="loot"></div></article><article class="panel stats-box"><h2>누적 통계</h2><div id="stats"></div></article></section><article class="panel"><h2>탐험 로그</h2><div id="log" class="log-box"></div></article></section><section id="innTab" class="tab-panel"><article class="panel"><h2>여관 · 파티</h2><p>캐릭터 선택 → 상세 능력치 / 장비</p><div id="party"></div></article><article class="panel"><h2>퀘스트</h2><div class="quest-tabs"><button id="mainQuestTab">메인</button><button id="repeatQuestTab">반복</button></div><div id="quests"></div></article></section><section id="shopTab" class="tab-panel"><article class="panel"><h2>상점</h2><p>장비와 소모품 판매 영역</p><div id="shop"></div></article></section><section id="extraTab" class="tab-panel"><article class="panel"><h2>기타</h2><p>도감 · 업적 · 설정 · 저장/불러오기</p></article></section></main><div id="characterDetail" class="modal" hidden></div><div id="logDetail" class="modal" hidden></div><script src="src/core/SeededRandom.js"></script><script src="src/core/GameState.js"></script><script src="src/battle/Character.js"></script><script src="src/battle/DamageCalculator.js"></script><script src="src/battle/BattleEngine.js"></script><script src="src/battle/BattleViewModel.js"></script><script src="src/character/CharacterFactory.js"></script><script src="data/characters/dummy-party.js"></script><script src="data/dungeons/ancient-forest.js"></script><script src="data/dungeons/goblin-cave.js"></script><script src="data/dungeons/ancient-ruins.js"></script><script src="data/dungeon-registry.js"></script><script src="data/dialogues.js"></script><script src="data/quests/main-quests.js"></script><script src="data/quests/repeatable-quests.js"></script><script src="data/quests/quest-registry.js"></script><script src="src/quest/QuestEngine.js"></script><script src="src/battle/DialogueResolver.js"></script><script src="src/world/DungeonRun.js"></script><script src="src/ui/PartyPanel.js"></script><script src="src/ui/ExplorationLogPanel.js"></script><script src="src/app.js"></script><script>let questTab='main';document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});function renderQuests(){const engine=window.questEngine;if(!engine){$('quests').innerHTML='<p>퀘스트 엔진 준비 중</p>';return}const list=engine.getActive(questTab==='main'?'main':'repeatable');$('quests').innerHTML=list.length?list.map(q=>`<div class="quest-item"><b>${q.name||q.title||q.id}</b><div>${q.description||''}</div>${(q.objectives||[]).map((o,i)=>`<div class="progress">${o.description||o.type}: ${engine.progress(q,i)} / ${o.count}</div>`).join('')}</div>`).join(''):'<p>진행 가능한 퀘스트가 없습니다.</p>'}function initQuestUI(){if(typeof QuestEngine==='undefined')return;window.questEngine=new QuestEngine({state,quests:window.ALL_QUESTS,onEvent:e=>{state.lastQuestEvent=e;renderQuests()}});renderQuests()}initQuestUI();function compactDungeonInfo(){if(!window.run||!$('dungeon'))return;const d=run.dungeon;const floor=Math.min(run.floor,d.floors);$('dungeon').innerHTML=`<div class="dungeon-info-line"><span><b>${d.name}</b></span><i class="sep">·</i><span>${floor}/${d.floors}층</span><i class="sep">·</i><span>${run.complete?'완료':run.active?'탐험 중':'종료'}</span><i class="sep">·</i><span>Seed ${state.seed}</span><i class="sep">·</i><span>G ${run.gold}</span><i class="sep">·</i><span>EXP ${run.exp}</span></div>`}if(window.render){const r=window.render;window.render=function(){r();compactDungeonInfo()}}else compactDungeonInfo();</script></body></html>
