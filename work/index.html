<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>autoRPG Dungeon Workbench</title><link rel="stylesheet" href="css/base.css"><style>.party-card{display:flex;width:100%;text-align:left;gap:10px;margin:6px 0;padding:8px}.party-card.down{opacity:.55}.portrait{width:42px;height:42px;display:grid;place-items:center;border:1px solid #aaa}.party-main{flex:1}.hpbar{height:6px;background:#ddd;margin:5px 0}.hpbar i{display:block;height:100%;background:#555}.party-main span,.party-main small{display:block}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center}.modal-card{background:white;padding:20px;min-width:280px;position:relative}.close{position:absolute;right:8px;top:8px}.modal-card dl{display:grid;grid-template-columns:1fr 1fr;gap:6px}.modal-card dt{font-weight:bold}.quest-tabs{display:flex;gap:6px;margin-bottom:8px}.quest-tabs button.active{font-weight:bold}.quest-item{padding:8px 0;border-bottom:1px solid #ddd}.quest-item.done{opacity:.65}.progress{font-size:.9em}.reward{font-size:.85em}</style></head><body><main class="app"><header><h1>autoRPG Dungeon Workbench</h1><p>던전 탐험 · 전투 · 누적 DPS · Loot · Quest 테스트</p><small id="status">준비</small></header><section class="toolbar"><label>던전 <select id="dungeonSelect"></select></label><label>Seed <input id="seed" type="number" value="12345"></label><button id="startDungeon">던전 탐험 시작</button><button id="stepDungeon" disabled>다음 진행</button><button id="run100">100회 전투</button><button id="reset">초기화</button></section><section class="grid"><article class="panel"><h2>던전</h2><div id="dungeon"></div></article><article class="panel"><h2>파티</h2><div id="party"></div></article><article class="panel battle-panel"><h2>현재 전투</h2><div id="battle"></div><div id="dialogue" class="dialogue"><div>“전투를 시작할 준비가 됐어.”</div><div>“모두 조심해서 가자.”</div></div></article><article class="panel"><h2>퀘스트</h2><div class="quest-tabs"><button id="mainQuestTab" class="active">메인</button><button id="repeatQuestTab">반복</button></div><div id="quests"></div></article><article class="panel"><h2>누적 통계</h2><div id="stats"></div></article><article class="panel"><h2>획득 아이템</h2><div id="loot"></div></article><article class="panel log-panel"><h2>탐험 로그</h2><pre id="log"></pre></article></section></main><div id="characterDetail" class="modal" hidden></div><script src="src/core/SeededRandom.js"></script><script src="src/core/GameState.js"></script><script src="src/battle/Character.js"></script><script src="src/battle/DamageCalculator.js"></script><script src="src/battle/BattleEngine.js"></script><script src="src/character/CharacterFactory.js"></script><script src="data/characters/dummy-party.js"></script><script src="data/dungeons/ancient-forest.js"></script><script src="data/dungeons/goblin-cave.js"></script><script src="data/dungeons/ancient-ruins.js"></script><script src="data/dungeon-registry.js"></script><script src="data/dialogues.js"></script><script src="data/quests/main-quests.js"></script><script src="data/quests/repeatable-quests.js"></script><script src="data/quests/quest-registry.js"></script><script src="src/quest/QuestEngine.js"></script><script src="src/battle/DialogueResolver.js"></script><script src="src/world/DungeonRun.js"></script><script src="src/ui/PartyPanel.js"></script><script src="src/app.js"></script><script>let questTab='main';function renderQuests(){const engine=window.questEngine;if(!engine){$('quests').innerHTML='<p>퀘스트 엔진 준비 중</p>';return}const list=engine.getActive(questTab==='main'?'main':'repeatable');$('quests').innerHTML=list.length?list.map(q=>{const p=state.quests?.[q.id];const done=p?.completed;return `<div class="quest-item ${done?'done':''}"><b>${q.name||q.title||q.id}</b><div>${q.description||''}</div>${q.objectives.map((o,i)=>`<div class="progress">${o.description||o.type}: ${engine.progress(q,i)} / ${o.count}</div>`).join('')}<div class="reward">${q.rewards?`보상: ${q.rewards.gold||0}G / EXP ${q.rewards.exp||0}`:''}</div></div>`}).join(''):'<p>진행 가능한 퀘스트가 없습니다.</p>'}function initQuestUI(){window.questEngine=new QuestEngine({state,quests:window.ALL_QUESTS,onEvent:e=>{state.lastQuestEvent=e;renderQuests();}});$('mainQuestTab').onclick=()=>{questTab='main';$('mainQuestTab').classList.add('active');$('repeatQuestTab').classList.remove('active');renderQuests()};$('repeatQuestTab').onclick=()=>{questTab='repeatable';$('repeatQuestTab').classList.add('active');$('mainQuestTab').classList.remove('active');renderQuests()};renderQuests()}const oldRender=window.render;const originalStart=startDungeon;startDungeon=function(){originalStart();state=createInitialGameState(state.seed||12345);initQuestUI();renderQuests()};initQuestUI();renderQuests();</script></body></html>
