<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>autoRPG</title><link rel="stylesheet" href="css/base.css"><style>*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:8px}.app header h1{font-size:20px;margin:4px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:sticky;top:0;z-index:100;background:inherit;padding:4px 0}.tabs button{min-height:44px;font-size:13px}.tabs button.active{font-weight:bold}.tab-panel{display:none}.tab-panel.active{display:block}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:6px}.toolbar button{min-height:42px}.toolbar label{display:flex;align-items:center;gap:4px}.toolbar select,.toolbar input{width:100%;min-height:40px}button,select,input{pointer-events:auto!important;cursor:pointer;position:relative;z-index:20}.panel{margin:7px 0;padding:9px}.party-card{display:flex;width:100%;text-align:left;gap:9px;margin:6px 0;padding:8px;cursor:pointer}.party-card.down{opacity:.55}.portrait{width:42px;height:42px;display:grid;place-items:center;border:1px solid #aaa}.party-main{flex:1}.hpbar{height:6px;background:#ddd;margin:5px 0}.hpbar i{display:block;height:100%;background:#555}.party-main span,.party-main small{display:block}.modal{position:fixed;inset:0;background:#0008;z-index:1000;align-items:center;justify-items:center}.modal[hidden]{display:none!important}.modal-card{background:#fff;color:#111;padding:20px;min-width:280px;max-width:90vw;position:relative}.close{position:absolute;right:8px;top:8px}.modal-card dl{display:grid;grid-template-columns:1fr 1fr;gap:6px}.quest-tabs{display:flex;gap:6px}.quest-item{padding:8px 0;border-bottom:1px solid #ddd}.progress{font-size:.9em}.dialogue{min-height:3em;margin-top:8px;padding:6px;border-top:1px solid #ddd}.battle-summary{padding:7px;border-bottom:1px solid #ddd}.battle-detail{max-height:260px;overflow:auto}.battle-event{font-size:.84em;padding:3px 0}.battle-event.defeat,.battle-event.critical{font-weight:bold}.loot{display:flex;justify-content:space-between}@media(max-width:520px){.app{padding:5px}.panel{padding:7px}.toolbar button{font-size:12px}.tabs button{font-size:12px}}</style></head><body><main class="app"><header><h1>autoRPG</h1><small id="status">준비</small></header><nav class="tabs"><button class="active" data-tab="dungeonTab">던전</button><button data-tab="innTab">여관</button><button data-tab="shopTab">상점</button><button data-tab="extraTab">기타</button></nav><section class="toolbar"><label>던전 <select id="dungeonSelect"></select></label><label>Seed <input id="seed" type="number" value="12345"></label><button id="startDungeon">던전 탐험 시작</button><button id="stepDungeon" disabled>다음 진행</button><button id="run100">100회 전투</button><button id="reset">초기화</button></section><section id="dungeonTab" class="tab-panel active"><article class="panel"><h2>던전</h2><div id="dungeon"></div></article><article class="panel battle-panel"><h2>현재 전투</h2><div id="battle"></div><div id="dialogue" class="dialogue"><div>“전투를 시작할 준비가 됐어.”</div><div>“모두 조심해서 가자.”</div></div></article><article class="panel"><h2>획득 아이템</h2><div id="loot"></div></article><article class="panel"><h2>누적 통계</h2><div id="stats"></div></article><article class="panel"><h2>탐험 로그</h2><pre id="log"></pre></article></section><section id="innTab" class="tab-panel"><article class="panel"><h2>여관 · 파티</h2><p>캐릭터 선택 → 상세 능력치 / 장비</p><div id="party"></div></article><article class="panel"><h2>퀘스트</h2><div class="quest-tabs"><button id="mainQuestTab" class="active">메인</button><button id="repeatQuestTab">반복</button></div><div id="quests"></div></article></section><section id="shopTab" class="tab-panel"><article class="panel"><h2>상점</h2><p>장비와 소모품 판매 영역</p><div id="shop"></div></article></section><section id="extraTab" class="tab-panel"><article class="panel"><h2>기타</h2><p>도감 · 업적 · 설정 · 저장/불러오기 확장 영역</p></article></section></main><div id="characterDetail" class="modal" hidden></div><script src="src/core/SeededRandom.js"></script><script src="src/core/GameState.js"></script><script src="src/battle/Character.js"></script><script src="src/battle/DamageCalculator.js"></script><script src="src/battle/BattleEngine.js"></script><script src="src/battle/BattleViewModel.js"></script><script src="src/character/CharacterFactory.js"></script><script src="data/characters/dummy-party.js"></script><script src="data/dungeons/ancient-forest.js"></script><script src="data/dungeons/goblin-cave.js"></script><script src="data/dungeons/ancient-ruins.js"></script><script src="data/dungeon-registry.js"></script><script src="data/dialogues.js"></script><script src="data/quests/main-quests.js"></script><script src="data/quests/repeatable-quests.js"></script><script src="data/quests/quest-registry.js"></script><script src="src/quest/QuestEngine.js"></script><script src="src/battle/DialogueResolver.js"></script><script src="src/world/DungeonRun.js"></script><script src="src/ui/PartyPanel.js"></script><script src="src/app.js"></script><script>let questTab='main';document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});function renderQuests(){const engine=window.questEngine;if(!engine){$('quests').innerHTML='<p>퀘스트 엔진 준비 중</p>';return}const list=engine.getActive(questTab==='main'?'main':'repeatable');$('quests').innerHTML=list.length?list.map(q=>{const p=state.quests?.[q.id];return `<div class="quest-item"><b>${q.name||q.title||q.id}</b><div>${q.description||''}</div>${(q.objectives||[]).map((o,i)=>`<div class="progress">${o.description||o.type}: ${engine.progress(q,i)} / ${o.count}</div>`).join('')}</div>`}).join(''):'<p>진행 가능한 퀘스트가 없습니다.</p>'}function initQuestUI(){window.questEngine=new QuestEngine({state,quests:window.ALL_QUESTS,onEvent:e=>{state.lastQuestEvent=e;renderQuests()}});renderQuests()}initQuestUI();renderQuests();</script></body></html>
