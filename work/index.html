<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>autoRPG</title><link rel="stylesheet" href="css/base.css"><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;min-width:0}body{font-size:14px}.app{width:100%;max-width:480px;margin:0 auto;padding:4px}.app header{padding:4px 6px}.app header h1{font-size:18px;margin:0 0 2px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;position:sticky;top:0;z-index:100;background:inherit;padding:3px 0}.tabs button{min-height:40px;padding:4px 2px;font-size:12px}.tab-panel{display:none}.tab-panel.active{display:block}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:4px}.toolbar label{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px;min-width:0;font-size:11px}.toolbar select,.toolbar input,.toolbar button{width:100%;min-width:0;min-height:38px;font-size:12px}.panel{width:100%;margin:4px 0;padding:6px;border-radius:4px;min-width:0}.dungeon-info-panel{height:72px!important;min-height:72px!important;max-height:72px!important;padding:1px 6px!important;margin:2px 0!important;overflow:hidden!important}.dungeon-info-panel #dungeon{height:70px!important;min-height:70px!important;max-height:70px!important;overflow:hidden!important}.dungeon-info-line{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:center!important;width:100%!important;height:22px!important;min-height:22px!important;max-height:22px!important;gap:5px!important;overflow-x:auto!important;overflow-y:hidden!important;white-space:nowrap!important;font-size:10px;line-height:22px}.dungeon-info-line>*{display:inline-block!important;flex:0 0 auto!important;width:auto!important;white-space:nowrap!important;margin:0!important}.dungeon-info-line .sep{opacity:.45}.battle-panel h2,.panel h2{font-size:15px;margin:2px 0 5px}.battle-detail{max-height:190px;overflow:auto}.battle-event{font-size:11px;padding:3px 0}.dialogue{min-height:42px;margin-top:5px;padding:5px;border-top:1px solid #ddd;font-size:12px;line-height:1.35}.loot-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px}.loot-box,.stats-box{min-width:0}.loot-box h2,.stats-box h2{font-size:14px}.loot,.stat-row{font-size:11px;padding:3px 0}.stat-row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #eee}.log-box{height:165px;overflow-y:auto;overflow-x:hidden;margin:0;border:1px solid #ddd;padding:4px;font-size:11px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.exploration-log-row{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:transparent;border:0;border-bottom:1px solid #ddd;padding:7px 2px;font-size:11px;min-height:34px}.exploration-log-row span{min-width:0;white-space:normal;overflow-wrap:anywhere;line-height:1.35}.exploration-log-row b{flex:0 0 auto;margin-left:5px}.detail-body{max-height:60vh;overflow:auto;font-size:11px;line-height:1.45}.detail-line{padding:3px 0;border-bottom:1px solid #eee}.party-card{display:flex;width:100%;text-align:left;gap:7px;margin:5px 0;padding:7px}.portrait{width:38px;height:38px;flex:0 0 38px}.party-main{min-width:0;flex:1}.hpbar{height:6px;margin:4px 0}.equip-row{display:grid;grid-template-columns:55px 1fr;align-items:center;gap:6px;margin:6px 0;font-size:11px}.equip-row select{width:100%;min-width:0;min-height:34px;font-size:11px}.modal{position:fixed;inset:0;background:#0008;z-index:1000;align-items:center;justify-items:center;padding:10px}.modal[hidden]{display:none!important}.modal:not([hidden]){display:grid}.modal-card{width:min(100%,430px);max-height:85vh;overflow:auto;background:#fff;color:#111;padding:16px;position:relative;border-radius:6px}.close{position:absolute;right:6px;top:6px;min-width:36px;min-height:36px}.quest-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px}.quest-item{padding:7px 0;border-bottom:1px solid #ddd}.progress{font-size:11px}button,select,input{pointer-events:auto!important;cursor:pointer;position:relative;z-index:20}</style></head><body><main class="app"><header><h1>autoRPG</h1><small id="status">준비</small></header><nav class="tabs"><button class="active" data-tab="dungeonTab">던전</button><button data-tab="innTab">여관</button><button data-tab="shopTab">상점</button><button data-tab="extraTab">기타</button></nav><section class="toolbar"><label>던전<select id="dungeonSelect"></select></label><label>Seed<input id="seed" type="number" value="12345"></label><button id="startDungeon">탐험 시작</button><button id="stepDungeon" disabled>다음 진행</button><button id="run100">100회 전투</button><button id="reset">초기화</button></section><section id="dungeonTab" class="tab-panel active"><article class="panel dungeon-info-panel"><div id="dungeon"></div></article><article class="panel battle-panel"><h2>현재 전투</h2><div id="battle"></div><div id="dialogue" class="dialogue"><div>“전투를 시작할 준비가 됐어.”</div><div>“모두 조심해서 가자.”</div></div></article><section class="loot-stats"><article class="panel loot-box"><h2>획득 아이템</h2><div id="loot"></div></article><article class="panel stats-box"><h2>누적 통계</h2><div id="stats"></div></article></section><article class="panel"><h2>탐험 로그</h2><div id="log" class="log-box"></div></article></section><section id="innTab" class="tab-panel"><article class="panel"><h2>여관 · 파티</h2><p>캐릭터 선택 → 상세 능력치 / 장비</p><div id="party"></div></article><article class="panel"><h2>퀘스트</h2><div class="quest-tabs"><button id="mainQuestTab">메인</button><button id="repeatQuestTab">반복</button></div><div id="quests"></div></article></section><section id="shopTab" class="tab-panel"><article class="panel"><h2>상점</h2><p>장비와 소모품 판매 영역</p><div id="shop"></div></article></section><section id="extraTab" class="tab-panel"><article class="panel"><h2>기타</h2><p>도감 · 업적 · 설정 · 저장/불러오기</p></article></section></main><div id="charact
