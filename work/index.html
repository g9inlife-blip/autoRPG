<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>autoRPG</title><link rel="stylesheet" href="css/base.css?v=20260902-5"></head><body><main class="app"><header><h1>autoRPG</h1><small id="status">준비</small></header><nav class="tabs"><button class="active" data-tab="dungeonTab">던전</button><button data-tab="innTab">여관</button><button data-tab="shopTab">상점</button><button data-tab="extraTab">기타</button></nav><section class="toolbar"><label>지역<select id="regionSelect"></select></label><label>던전<select id="dungeonSelect"></select></label><label>Seed<input id="seed" type="number" value="12345"></label><button id="startDungeon">탐험 시작</button><button id="stepDungeon">다음 진행</button><button id="run100">100회 전투</button><button id="balanceTest">던전 밸런스</button><button id="bossBalanceTest">보스 밸런스</button><button id="bossBalanceAllTest">전체 보스</button><button id="monsterBalanceAllTest">전체 몬스터</button><button id="reset">초기화</button></section><section id="dungeonTab" class="tab-panel active"><article class="panel dungeon-info-panel"><div id="dungeon"></div></article><article class="panel battle-panel"><h2>현재 전투</h2><div id="battle"></div><div id="dialogue" class="dialogue"><div>“전투를 시작할 준비가 됐어.”</div><div>“모두 조심해서 가자.”</div></div></article><section class="loot-stats"><article class="panel loot-box"><h2>획득 아이템</h2><div id="loot"></div></article><article class="panel stats-box"><h2>누적 통계</h2><div id="stats"></div></article></section><article class="panel"><h2>탐험 로그</h2><div id="log" class="log-box"></div></article></section><section id="innTab" class="tab-panel"><article class="panel"><h2>여관 · 파티</h2><div id="regionInnContext" class="region-context"></div><p>캐릭터 선택 → 상세 능력치 / 장비</p><div id="party"></div></article><article class="panel"><h2>퀘스트</h2><div class="quest-tabs"><button id="mainQuestTab">메인</button><button id="repeatQuestTab">반복</button></div><div id="quests"></div></section><section id="shopTab" class="tab-panel"><article class="panel"><h2>지역 상점</h2><div id="regionShopContext" class="region-context"></div><p>지역별 판매 목록은 지역 설정에서 확장할 수 있습니다.</p><div id="shop"></div></section><section id="extraTab" class="tab-panel"><article class="panel"><h2>기타</h2><p>도감 · 업적 · 설정 · 저장/불러오기</p></article></section></main><div id="characterDetail" class="modal" hidden></div><div id="logDetail" class="modal" hidden></div><script src="src/core/SeededRandom.js"></script><script src="src/core/GameState.js"></script><script src="src/battle/Character.js?v=20260902-3"></script><script src="src/character/CharacterProgression.js?v=20260902-1"></script><script src="src/battle/DamageCalculator.js"></script><script src="data/skills/skill-registry.js?v=20260901-1"></script><script src="src/battle/BattleEngine.js?v=20260901-3"></script><script src="src/battle/BattleViewModel.js"></script><script src="src/character/CharacterFactory.js?v=20260901-1"></script><script src="data/characters/dummy-party.js"></script><script src="data/equipment/equipment-registry.js?v=20260901-1"></script><script src="src/world/EquipmentDatabase.js?v=20260902-1"></script><script src="src/world/EquipmentXmlLoader.js?v=20260902-3"></script><script src="src/world/MonsterXmlLoader.js?v=20260902-3"></script><script src="src/world/DungeonMonsterPlacementLoader.js?v=20260902-2"></script><script src="src/world/StoryXmlLoader.js?v=20260902-1"></script><script src="src/world/LootSystem.js?v=20260902-3"></script><script src="src/world/MonsterScaling.js?v=20260902-1"></script><script src="data/dungeon-registry.js?v=20260902-9"></script><script src="data/dialogues.js"></script><script src="data/quests/main-quests.js"></script><script src="data/quests/repeatable-quests.js"></script><script src="data/quests/quest-registry.js"></script><script src="data/region-config.js?v=20260902-2"></script><script src="data/region-registry.js?v=20260902-3"></script><script src="src/quest/QuestEngine.js"></script><script src="src/battle/DialogueResolver.js"></script><script src="src/world/EncounterResolver.js?v=20260903-3"></script><script src="src/world/BattleBalanceCalculator.js?v=20260902-4"></script><script src="src/world/DungeonRun.js?v=20260903-2"></script><script src="src/world/DungeonEvents.js?v=20260902-2"></script><script src="src/world/DungeonBalance.js?v=20260902-3"></script><script src="src/ui/DungeonBalancePanel.js?v=20260902-2"></script><script src="src/ui/PartyPanel.js?v=20260902-3"></script><script src="src/ui/ExplorationLogPanel.js?v=20260902-3"></script><script src="src/app.js?v=20260902-5"></script><script src="src/ui/DungeonAreaTerminology.js?v=20260902-1"></script><script src="src/ui/RegionPanel.js?v=20260903-1"></script><script src="src/ui/ShopPanel.js?v=20260902-7"></script><script src="src/ui/ExplorationControl.js?v=20260903-3"></script><script>(async()=>{const results=await Promise.all([window.EquipmentXmlLoader?.load(),window.MonsterXmlLoader?.load(),window.DungeonMonsterPlacementLoader?.load(),window.StoryXmlLoader?.load()]);console.log('[Data XML]',results.map(x=>x?.loaded));window.syncXmlDungeons?.();window.syncXmlRegions?.();window.regionUiSync?.();window.render?.();window.renderQuests?.();window.shopRender?.();const b=document.getElementById('balanceTest');if(b)b.addEventListener('click',()=>{const id=document.getElementById('dungeonSelect')?.value;const result=window.runDungeonBalanceTest?.(id,100,Number(document.getElementById('seed')?.value)||12345);if(!result)return;const rows=result.floors||[];document.getElementById('battle').innerHTML=`<p><b>${result.dungeon.name}</b> 던전 밸런스 · ${result.runs}회</p>${rows.map(r=>`<p>${r.floor}구역 Lv.${r.level} · ${r.name} [${String(r.grade).toUpperCase()}] · 승률 ${r.winRate}% · 평균 ${r.avgRounds}R · 사망 ${r.deathRate}% · HP ${r.hp} / ATK ${r.attack} / DEF ${r.defense} / EXP ${r.exp}</p>`).join('')}<p><b>최종 클리어율: ${result.clearRate}%</b></p>`;});const renderBoss=(r,validated=true)=>{const chars=r.reference.characters.map(c=>`<p>${c.classId}: ATK ${c.attack} / HP ${Math.round(c.hp)} / DEF ${Math.round(c.defense)} / 기대DPR ${c.expectedDpr.toFixed(1)}</p>`).join('');const validation=validated&&r.simulation90?`<p>90% 검증: ${r.simulation90.runs}회 · 승률 <b>${Math.round(r.simulation90.winRate*100)}%</b> · 평균 ${r.simulation90.avgRounds.toFixed(1)}R · 검증 HP ${r.recommendedHp90}</p>`:'';document.getElementById('battle').innerHTML=`<p><b>${r.dungeon}</b> Lv.${r.level} · ${r.boss.name}</p><p>목표 TTK: <b>${r.targetRounds}R</b> · 파티 기대 DPS: <b>${r.reference.partyDpr.toFixed(1)}</b></p>${chars}<p>모델 Boss HP: <b>${r.modelHp}</b> · 예상 처치: ${r.balance.expectedClearRounds.toFixed(1)}R</p><p>모델 Boss ATK: <b>${r.modelAttack}</b> / DEF ${r.modelDefense} · 생존 목표 ${r.balance.desiredSurvivalRounds.toFixed(1)}R · 예상 ${r.balance.estimatedSurvivalRounds.toFixed(1)}R</p><p>기존 Boss HP ${r.boss.oldHp} / ATK ${r.boss.oldAttack} / DEF ${r.boss.oldDefense}</p>${validation}`;};const bb=document.getElementById('bossBalanceTest');if(bb)bb.addEventListener('click',()=>{const id=document.getElementById('dungeonSelect')?.value;const dungeon=window.DUNGEONS?.[id]||Object.values(window.DUNGEONS||{}).find(d=>d.id===id);if(!dungeon)return;const r=window.BattleBalanceCalculator?.findBossHp90(dungeon,{runs:1000,seed:Number(document.getElementById('seed')?.value)||12345});if(r)renderBoss(r,true);});const ba=document.getElementById('bossBalanceAllTest');if(ba)ba.addEventListener('click',()=>{const list=Object.values(window.DUNGEONS||{}).sort((a,b)=>window.BattleBalanceCalculator.levelForDungeon(a)-window.BattleBalanceCalculator.levelForDungeon(b));const rows=list.map(d=>window.BattleBalanceCalculator.calculateBossHp(d));document.getElementById('battle').innerHTML=`<p><b>전체 보스 TTK 밸런스</b></p>${rows.map(r=>`<p>Lv.${r.level} ${r.boss.name} · 목표 ${r.targetRounds}R · 기대DPS ${r.reference.partyDpr.toFixed(1)} · 모델 HP <b>${r.modelHp}</b> · 모델 ATK <b>${r.modelAttack}</b> · 생존목표 ${r.balance.desiredSurvivalRounds.toFixed(1)}R · 기존 HP ${r.boss.oldHp} / ATK ${r.boss.oldAttack}</p>`).join('')}`;});const ma=document.getElementById('monsterBalanceAllTest');if(ma)ma.addEventListener('click',()=>{const list=Object.values(window.DUNGEONS||{}).sort((a,b)=>window.BattleBalanceCalculator.levelForDungeon(a)-window.BattleBalanceCalculator.levelForDungeon(b));const rows=list.flatMap(d=>window.BattleBalanceCalculator.calculateDungeonMonsters(d)||[]);document.getElementById('battle').innerHTML=`<p><b>전체 몬스터 TTK 밸런스</b> · 일반 2.5R / 레어 4R / 보스 9R</p>${rows.map(r=>`<p>Lv.${r.level} ${r.name} [${r.kind}] · HP <b>${r.hp}</b> · ATK <b>${r.attack}</b> · DEF ${r.defense} · 목표 ${r.targetRounds}R · 기대DPS ${r.balance.partyDpr.toFixed(1)}R · 생존 ${r.balance.estimatedSurvivalRounds.toFixed(1)}R</p>`).join('')}`;});})();</script></body></html>
