<!doctype html><html lang="ko"><meta charset="utf-8"><title>autoRPG Logic Test</title><style>body{font:16px sans-serif;max-width:900px;margin:30px auto}button{margin:4px;padding:8px}pre{background:#eee;padding:12px;min-height:200px}</style><h1>autoRPG Logic Test</h1><button id="battle">전투 100회</button><button id="quest">퀘스트 이벤트</button><button id="dialogue">대사 테스트</button><pre id="out">테스트 준비</pre><script src="core/SeededRandom.js"></script><script src="core/GameState.js"></script><script src="battle/Character.js"></script><script src="battle/DamageCalculator.js"></script><script src="battle/BattleEngine.js"></script><script src="quest/QuestEngine.js"></script><script src="../data/quests/main-quests.js"></script><script src="../data/quests/repeatable-quests.js"></script><script src="../data/quests/quest-registry.js"></script><script src="../data/dialogues.js"></script><script>const out=x=>document.getElementById('out').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);battle.onclick=()=>{let wins=0;for(let i=0;i<100;i++){const rng=new SeededRandom(100+i);const p=[new Character({id:'hero',name:'기사',hp:420,attack:62,defense:35,speed:12,team:'player'})];const e=[new Character({id:'goblin',name:'고블린',hp:220,attack:44,defense:18,speed:9,team:'enemy'})];const b=new BattleEngine({rng,damageCalculator:new DamageCalculator(rng)}).run(p,e);if(b.result==='WIN')wins++}out(`100회 전투 완료\n승리: ${wins}\n승률: ${wins}%`)};quest.onclick=()=>{const s={quests:{}};const q=new QuestEngine({state:s,quests:window.ALL_QUESTS});q.record({type:'kill',target:'goblin',count:5});out(s)};dialogue.onclick=()=>out((new DialogueResolver(window.DIALOGUE_DATA)).resolve({action:'critical',rng:new SeededRandom(1)}));</script></html>
