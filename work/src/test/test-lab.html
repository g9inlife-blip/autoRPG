<!doctype html><html lang="ko"><meta charset="utf-8"><title>autoRPG Test Lab</title><style>body{font:16px sans-serif;max-width:900px;margin:24px auto}button{padding:8px;margin:4px}pre{background:#f3f3f3;padding:14px;white-space:pre-wrap}.pass{font-weight:bold}</style><h1>autoRPG Test Lab</h1><p>콘텐츠와 핵심 로직을 화면과 분리해 검증하는 테스트 도구</p><button onclick="run('Story 분기',testStory)">Story 분기</button><button onclick="run('Quest 진행',testQuest)">Quest 진행</button><button onclick="run('Dialogue 우선순위',testDialogue)">Dialogue</button><button onclick="run('Seed 재현성',testSeed)">Seed</button><button onclick="runAll()">전체 테스트</button><pre id="out">대기 중...</pre><script src="../core/SeededRandom.js"></script><script src="../quest/QuestEngine.js"></script><script src="../story/StoryEngine.js"></script><script src="../battle/DialogueResolver.js"></script><script src="../../data/quests/main-quests.js"></script><script src="../../data/quests/repeatable-quests.js"></script><script src="../../data/quests/quest-registry.js"></script><script src="../../data/story/story-registry.js"></script><script src="../../data/dialogues.js"></script><script>function ok(name,detail){return {name,pass:true,detail}}function testStory(){const s={flags:{}};const e=new StoryEngine({state:s,nodes:STORY_NODES});e.choose('story.forest.001','investigate');return ok('Story 분기',s.flags.forest_investigated===true?'investigate flag OK':'FAIL')}function testQuest(){const s={quests:{}};const e=new QuestEngine({state:s,quests:ALL_QUESTS});e.record({type:'kill',target:'goblin',count:5});const p=s.quests['main.002'];return ok('Quest 진행',p?.progress?.[0]===5?'goblin 5/5':'FAIL')}function testDialogue(){const r=new DialogueResolver({rng:new SeededRandom(1),dialogueData:DIALOGUE_DATA||DIALOGUES});const a=r.resolve({action:'critical',actor:{personality:'brave',bonds:{m:{value:90}}},party:[{id:'m'}]});return ok('Dialogue 우선순위',!!a?'대사 선택 OK':'FAIL')}function testSeed(){const a=new SeededRandom(123),b=new SeededRandom(123),x=[a.next(),a.next(),a.next()],y=[b.next(),b.next(),b.next()];return ok('Seed 재현성',JSON.stringify(x)===JSON.stringify(y)?'동일 Seed 동일 결과':'FAIL')}function run(n,f){const r=f();out.textContent=(r.pass?'PASS':'FAIL')+'  '+n+'\n'+r.detail}function runAll(){const rs=[testStory(),testQuest(),testDialogue(),testSeed()];out.textContent=rs.map(r=>(r.pass?'PASS':'FAIL')+' '+r.name+' — '+r.detail).join('\n')}</script></html>
